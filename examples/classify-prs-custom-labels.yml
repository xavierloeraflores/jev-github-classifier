name: Classify pull requests with custom labels

on:
  # Reads PR metadata only. Do not check out or execute code from the PR.
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          LABELER_URL: ${{ vars.LABELER_URL }}
          LABELER_API_KEY: ${{ secrets.LABELER_API_KEY }}
        with:
          script: |
            const { title, body } = context.payload.pull_request;
            // Edit these names and descriptions to match your repository.
            const labels = {
              "type: bug": "Fixes broken behavior or behavior that differs from expectations.",
              "type: feature": "Adds new functionality or improves existing functionality.",
              "type: docs": "Adds or improves documentation.",
              "type: question": "A pull request asking a question or needing more information to understand its intent.",
            };
            const classifierUrl = new URL("/api/classify-pr", process.env.LABELER_URL);
            const response = await fetch(classifierUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${process.env.LABELER_API_KEY}`,
              },
              body: JSON.stringify({ title, body, labels }),
              signal: AbortSignal.timeout(60000),
            });
            if (!response.ok) {
              throw new Error(`Classifier returned HTTP ${response.status}`);
            }
            const { classification } = await response.json();
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [classification],
            });
